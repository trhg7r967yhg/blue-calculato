<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ماشین حساب من</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0; min-height: 100vh;
  display: grid; place-items: center;
  background: radial-gradient(circle at top, #102c52, #050812 65%);
  font-family: Arial, sans-serif; color: white;
}
.calc {
  width: 320px; padding: 22px;
  background: #101827; border: 1px solid #168cff;
  border-radius: 24px;
  box-shadow: 0 0 35px #087bff55;
}
h2 { text-align: center; color: #40b5ff; letter-spacing: 2px; }
#display {
  width: 100%; height: 75px; margin: 10px 0 18px;
  border: 1px solid #234c75; border-radius: 12px;
  background: #050b15; color: #65c7ff;
  text-align: right; padding: 12px;
  font-size: 30px; outline: none;
}
.keys { display: grid; grid-template-columns: repeat(4, 1fr); gap: 9px; }
button {
  height: 55px; border: 1px solid #263e5c;
  border-radius: 12px; background: #1b293c;
  color: white; font-size: 20px; cursor: pointer;
}
button:hover { background: #1765a8; box-shadow: 0 0 12px #168cff88; }
.op { background: #0757a5; }
.clear { background: #8b2635; }
.equal { background: #087ee5; }
</style>
</head>
<body>
<div class="calc">
  <h2>MY CALCULATOR</h2>
  <input id="display" value="0" readonly>
  <div class="keys">
    <button class="clear" onclick="clearAll()">AC</button>
    <button onclick="del()">⌫</button>
    <button class="op" onclick="press('%')">%</button>
    <button class="op" onclick="press('/')">÷</button>

    <button onclick="press('7')">7</button>
    <button onclick="press('8')">8</button>
    <button onclick="press('9')">9</button>
    <button class="op" onclick="press('*')">×</button>

    <button onclick="press('4')">4</button>
    <button onclick="press('5')">5</button>
    <button onclick="press('6')">6</button>
    <button class="op" onclick="press('-')">−</button>

    <button onclick="press('1')">1</button>
    <button onclick="press('2')">2</button>
    <button onclick="press('3')">3</button>
    <button class="op" onclick="press('+')">+</button>

    <button onclick="press('(')">(</button>
    <button onclick="press('0')">0</button>
    <button onclick="press('.')">.</button>
    <button class="equal" onclick="calculate()">=</button>
  </div>
</div>
<script>
const display = document.getElementById('display');
let expression = '';
function update() { display.value = expression || '0'; }
function press(v) {
  expression += v;
  update();
}
function clearAll() { expression = ''; update(); }
function del() { expression = expression.slice(0,-1); update(); }
function calculate() {
  try {
    if (!expression || !/^[0-9+\-*/%.() ]+$/.test(expression)) throw Error();
    let result = Function('"use strict"; return (' + expression + ')')();
    if (!Number.isFinite(result)) throw Error();
    expression = String(Math.round((result + Number.EPSILON) * 1e10) / 1e10);
    update();
  } catch {
    display.value = 'خطا!';
    expression = '';
  }
}
</script>
</body>
</html>
